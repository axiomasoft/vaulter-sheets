openapi: 3.1.0
info:
  title: Vaulter Sheets owner API
  version: '1'
servers:
  - url: /api/vaulter-sheets/v1
paths:
  /workbooks/{node}:
    parameters:
      - $ref: '#/components/parameters/node'
    get:
      operationId: openWorkbook
      responses:
        '200':
          description: Authoritative workbook, marker and available commands
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [workbook, marker, etag, profile, commands, exchange]
                    properties:
                      workbook: {$ref: './workbook-v2.schema.json'}
                      marker: {$ref: '#/components/schemas/marker'}
                      etag: {type: string}
                      profile: {$ref: './runtime-v1.schema.json#/$defs/profile'}
                      commands:
                        type: array
                        items:
                          enum:
                            - set_number
                            - set_text
                            - set_boolean
                            - set_formula
                            - set_values
                            - insert_row_before
                            - delete_row
                            - insert_column_before
                            - delete_column
                            - add_sheet
                            - rename_sheet
                            - delete_sheet
                            - set_format
                            - merge_cells
                            - unmerge_cells
                            - set_freeze
                            - fill_formula
                      exchange: {$ref: '#/components/schemas/exchangeCapabilities'}
        '404': {$ref: '#/components/responses/unavailable'}
  /workbooks/{node}/commands:
    parameters:
      - $ref: '#/components/parameters/node'
    post:
      operationId: commitWorkbookCommand
      parameters:
        - in: header
          name: If-Match
          description: Required for exact_base (structural/sheet commands: insert_row_before, delete_row, insert_column_before, delete_column, add_sheet, rename_sheet, delete_sheet) and rebase_cells (set_number, set_text, set_boolean, set_formula, set_values, set_format, merge_cells, unmerge_cells, set_freeze). Omit for revalidate_by_id (fill_formula).
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command_id, expected_generation, policy, commands]
              properties:
                command_id: {type: string, pattern: '^[A-Za-z0-9._-]{1,255}$'}
                expected_generation: {type: integer, minimum: 0, maximum: 9007199254740991}
                policy: {enum: [exact_base, rebase_cells, revalidate_by_id]}
                commands:
                  type: array
                  minItems: 1
                  maxItems: 64
                  items: {$ref: './runtime-v1.schema.json#/$defs/command'}
      responses:
        '200': {description: Committed or replayed receipt}
        '202': {description: Command is running}
        '404': {$ref: '#/components/responses/unavailable'}
        '409': {description: Version, generation, scope or idempotency conflict}
        '410': {description: Replay window expired}
        '413': {description: Message or workbook limit exceeded}
        '422': {description: Invalid or unsupported operation}
        '503': {description: Runtime failure, timeout or contention}
  /workbooks/{node}/commands/{command}:
    parameters:
      - $ref: '#/components/parameters/node'
      - in: path
        name: command
        required: true
        schema: {type: string}
    get:
      operationId: workbookCommandStatus
      responses:
        '200': {description: Committed receipt}
        '202': {description: Command is running}
        '404': {$ref: '#/components/responses/unavailable'}
        '409': {description: Saved conflict}
        '410': {description: Replay window expired}
        '422': {description: Saved validation rejection}
  /workbooks/{node}/ranges:
    parameters:
      - $ref: '#/components/parameters/node'
    get:
      operationId: readWorkbookRange
      parameters:
        - in: query
          name: sheet_id
          required: true
          schema: {type: string}
        - in: query
          name: range
          required: true
          schema: {type: string, maxLength: 32}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 10000, default: 10000}
        - in: query
          name: fields
          style: form
          explode: false
          schema: {type: array, items: {enum: [value, formula]}}
      responses:
        '200': {description: Calculated bounded range}
        '404': {$ref: '#/components/responses/unavailable'}
        '422': {description: Invalid range or sheet identifier (invalid_command)}
        '503': {description: Calculation pending or unavailable}
  /workbooks/{node}/exchanges:
    parameters:
      - $ref: '#/components/parameters/node'
    post:
      operationId: registerWorkbookExchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_key, kind, format, source]
              properties:
                request_key: {type: string, minLength: 1, maxLength: 255}
                kind: {enum: [import, export]}
                format: {enum: [csv, xlsx]}
                source: {type: object}
                options: {type: object}
      responses:
        '200': {description: Replayed terminal exchange job}
        '202': {description: Exchange job accepted or running}
        '403': {description: Caller lacks required edit or download ability}
        '404': {$ref: '#/components/responses/unavailable'}
        '409': {description: Idempotency conflict or version mismatch}
        '413': {description: File or workbook limit exceeded}
        '422': {description: Invalid exchange payload or format disabled}
        '429': {description: Active exchange quota reached for this actor and project (too_many_exchanges)}
  /workbooks/{node}/exchanges/{exchange}:
    parameters:
      - $ref: '#/components/parameters/node'
      - in: path
        name: exchange
        required: true
        schema: {type: string}
    get:
      operationId: workbookExchangeStatus
      responses:
        '200': {description: Exchange job status and report}
        '404': {$ref: '#/components/responses/unavailable'}
  /workbooks/{node}/exchanges/{exchange}/download:
    parameters:
      - $ref: '#/components/parameters/node'
      - in: path
        name: exchange
        required: true
        schema: {type: string}
    get:
      operationId: downloadWorkbookExchange
      responses:
        '200': {description: Exported CSV or XLSX file}
        '403': {description: Caller lacks download ability}
        '404': {$ref: '#/components/responses/unavailable'}
        '409': {description: Export is not ready}
  /workbooks/{node}/realtime/session:
    parameters:
      - $ref: '#/components/parameters/node'
    post:
      operationId: openWorkbookRealtimeSession
      responses:
        '200':
          description: Room credential for the caller's current grant
          headers:
            Cache-Control: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/realtimeSession'}
        '404': {$ref: '#/components/responses/unavailable'}
        '409': {description: Workbook is not in journal mode}
  /workbooks/{node}/realtime/profile:
    parameters:
      - $ref: '#/components/parameters/node'
      - $ref: '#/components/parameters/ifMatch'
    put:
      operationId: switchWorkbookRealtimeProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: {enum: [snapshot, journal]}
      responses:
        '200':
          description: Workbook write mode after the switch
          headers:
            Cache-Control: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/realtimeProfile'}
        '404': {$ref: '#/components/responses/unavailable'}
        '409': {description: If-Match does not match the current marker}
        '422': {description: Mode or If-Match is missing}
  /realtime/owner/ready:
    post:
      operationId: workbookRealtimeOwnerReady
      parameters:
        - $ref: '#/components/parameters/ownerCredential'
      responses:
        '200':
          description: Owner protocol the hub should speak
          headers:
            Cache-Control: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [protocol]
                properties:
                  protocol: {const: univer-sheets/1}
        '401': {description: Owner credential is missing or wrong}
  /realtime/owner/{action}:
    parameters:
      - $ref: '#/components/parameters/ownerCredential'
      - in: path
        name: action
        required: true
        schema: {enum: [acquire, renew, release, read, append]}
    post:
      operationId: workbookRealtimeOwnerCall
      parameters:
        - in: header
          name: Authorization
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/realtimeOwnerRequest'}
      responses:
        '200':
          description: Lease, snapshot, release, or committed mutation receipt
          headers:
            Cache-Control: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/realtimeOwnerResult'}
        '401': {description: Owner credential or room token is invalid}
        '403': {description: Room grant is read-only}
        '404': {$ref: '#/components/responses/unavailable'}
        '409': {description: Fence, base sequence, or generation conflict}
        '412': {description: Room binding does not match the credential}
        '413': {description: Owner body exceeds 1 MiB}
        '422': {description: Owner body failed validation}
        '503': {description: Room checkpoint is unavailable}
components:
  parameters:
    node:
      in: path
      name: node
      required: true
      schema: {type: string}
    ifMatch:
      in: header
      name: If-Match
      required: true
      schema: {type: string}
    ownerCredential:
      in: header
      name: X-Vaulter-Sheets-Owner
      required: true
      schema: {type: string, minLength: 32, maxLength: 4096}
  schemas:
    exchangeCapabilities:
      type: object
      required: [formats, import, export]
      properties:
        formats: {type: array, items: {enum: [csv, xlsx]}}
        import: {type: array, items: {enum: [csv, xlsx]}}
        export: {type: array, items: {enum: [csv, xlsx]}}
    marker:
      type: object
      required: [generation, position, sha256]
      properties:
        generation: {type: integer, minimum: 0, maximum: 9007199254740991}
        position: {type: integer, minimum: 0, maximum: 9007199254740991}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    realtimeSession:
      type: object
      required: [protocol, version, endpoint, token, expires_at, mode, node_id, generation, schema_version, options]
      properties:
        protocol: {type: string}
        version: {const: univer-sheets/1}
        endpoint: {type: [string, 'null']}
        token: {type: string}
        expires_at: {type: integer}
        mode: {enum: [read, write]}
        node_id: {type: string}
        generation: {type: integer, minimum: 0}
        schema_version: {type: integer}
        options:
          type: object
          additionalProperties: {type: [string, integer, boolean, 'null']}
    realtimeProfile:
      type: object
      required: [generation, position, mode]
      properties:
        generation: {type: integer, minimum: 0}
        position: {type: integer, minimum: 0}
        mode: {enum: [snapshot, journal]}
    realtimeOwnerRequest:
      type: object
      required: [room, owner_id]
      properties:
        room: {type: string}
        owner_id: {type: string, format: uuid}
        owner_fence: {type: integer, minimum: 1, maximum: 9007199254740991}
        after_seq: {type: integer, minimum: 0, maximum: 9007199254740991}
        include_state: {type: boolean}
        base_seq: {type: integer, minimum: 0, maximum: 9007199254740991}
        if_match: {type: [string, 'null']}
        intent: {type: object}
    realtimeOwnerResult:
      type: object
      properties:
        owner_fence: {type: integer, minimum: 1}
        head_seq: {type: integer, minimum: 0}
        owner_expires_at: {type: [string, 'null']}
        released: {type: boolean}
        unchanged: {type: boolean}
        generation: {type: integer, minimum: 0}
        checkpoint_seq: {type: integer, minimum: 0}
        checkpoint: {type: string}
        tail: {type: array, items: {type: object}}
        etag: {type: string}
        marker: {$ref: '#/components/schemas/marker'}
        insertions: {type: [array, 'null'], items: {}}
        receipt_id: {type: string}
        seq: {type: integer, minimum: 0}
        command_id: {type: string}
        state: {type: string}
  responses:
    unavailable:
      description: Resource unavailable to the caller
