name: Lint workflows
description: Run actionlint and zizmor on .github/workflows and composite actions.

runs:
  using: composite
  steps:
    - name: Install actionlint 1.7.12
      shell: bash
      run: |
        set -euo pipefail
        version=1.7.12
        archive="actionlint_${version}_linux_amd64.tar.gz"
        checksum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" -o "/tmp/${archive}"
        echo "${checksum}  /tmp/${archive}" | sha256sum -c
        tar -C /tmp -xzf "/tmp/${archive}" actionlint
        echo /tmp >> "$GITHUB_PATH"

    - name: actionlint
      shell: bash
      # actionlint 1.7.12 (latest) does not yet parse GitHub's 2026 self-repository
      # form uses: $/..., which the hosted runner already accepts.
      run: actionlint -color -ignore 'specifying action "\$/.+" in invalid format because ref is missing'

    - name: zizmor
      uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
      with:
        inputs: .github
        collect: all
        online-audits: "false"
        advanced-security: "false"
        annotations: "true"
        version: "1.33.1"
        persona: regular
