name: CI

# PHP 8.4 and 8.5, PostgreSQL 18.7 and 19.0, Node.js 26.13.1.
# Migrations run before the unindexed-FK gate, then Pest. The static job runs
# PHPStan, Pint, Rector (dry run) and 100 % type coverage once per PHP
# version. JS workspaces, package CI scripts, and the runtime/realtime images
# are built here.
# Stop-cranes (scripts/ci/engineering-rails.py), enforced before review:
# Zero-Royalty denylist (0 forbidden packages), 64-bit hashtextextended locks,
# no session pg_advisory_lock, no DEFERRABLE INITIALLY DEFERRED, no raw
# DB::transaction(), no set_config(..., false), no parse_url(), no
# ZipArchive::extractTo(), no CURLOPT_RESOLVE, no unindexed FK, no
# Helpers/Utils/Common/Misc/Traits directories, no @phpstan-ignore,
# no @psalm-suppress, no test ->skip(), no Eloquent Model on an #[Api]
# surface, no libclamav linkage, no registry.tiptap.dev.
# scripts/ci/engineering-rails.py carries a negative fixture (--self-test) that
# must fail when a forbidden package or a banned call is introduced.
# Private sibling checkouts sit beside GITHUB_WORKSPACE
# (../vaulter, ../vaulter-collaboration, ../packman) so Composer path
# repositories and packages/vue file:../../../vaulter/packages/vue resolve.
# scripts/ci/checkout-ecosystem.sh fetches them: vaulter and
# vaulter-collaboration at main, Packman at the tag the root composer.json
# pins. secrets.VAULTER_READ_TOKEN is sent as an HTTP header for the private
# axiomasoft repositories. An existing sibling directory is reused.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stop-cranes:
    name: Stop-cranes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Assert Node.js >=26.13.1
        run: |
          node -e 'const parts = process.versions.node.split(".").map(Number); const ok = parts[0] > 26 || (parts[0] === 26 && (parts[1] > 13 || (parts[1] === 13 && parts[2] >= 1))); if (!ok) { console.error(process.versions.node); process.exit(1); }'
          node -e 'const engines = require("./package.json").engines || {}; if (engines.node !== ">=26.13.1") { console.error(engines); process.exit(1); }'

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.4"
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-version --strict --no-interaction

      - name: License and source stop-cranes
        run: |
          python3 scripts/ci/engineering-rails.py --root "$GITHUB_WORKSPACE"
          python3 scripts/ci/engineering-rails.py --self-test

  php:
    name: PHP ${{ matrix.php }} / PG ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        postgres: ['18.7', '19.0']
        include:
          - postgres: '18.7'
            image: postgres:18.7@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
          - postgres: '19.0'
            image: postgres:19.0@sha256:aaa10f7ba7328b4a221a6c3184d83eef885bd16bf1f6de864757863156b0a4d1
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: vaulter
          POSTGRES_DB: vaulter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaulter -d vaulter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: vaulter_test
      DB_USERNAME: vaulter
      DB_PASSWORD: vaulter
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: vaulter
      PGPASSWORD: vaulter
      PGDATABASE: vaulter_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout sibling repositories
        env:
          VAULTER_READ_TOKEN: ${{ secrets.VAULTER_READ_TOKEN }}
        run: scripts/ci/checkout-ecosystem.sh vaulter vaulter-collaboration packman

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, xmlreader, zip, pdo_pgsql, pgsql
          coverage: none

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Assert PostgreSQL ${{ matrix.postgres }}
        run: |
          ver=$(psql -tAc 'SHOW server_version')
          ver=${ver//[[:space:]]/}
          echo "server_version=${ver}"
          expected="${{ matrix.postgres }}"
          case "${ver}" in
            ${expected}*) ;;
            *) echo "expected PostgreSQL ${expected}, got ${ver}" >&2; exit 1 ;;
          esac

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install libatomic1
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libatomic1

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Install Node dependencies
        run: npm ci

      - name: Migrate
        run: php tests/e2e/owner.php

      - name: Zero unindexed foreign keys
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/unindexed-fks.sql

      - name: Test
        run: composer test

  static:
    name: PHP ${{ matrix.php }} static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout sibling repositories
        env:
          VAULTER_READ_TOKEN: ${{ secrets.VAULTER_READ_TOKEN }}
        run: scripts/ci/checkout-ecosystem.sh vaulter vaulter-collaboration packman

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, xmlreader, zip, pdo_pgsql, pgsql
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan
        run: composer analyse

      - name: Pint
        run: composer lint:check

      - name: Rector
        run: composer refactor:check

      - name: Type coverage
        run: composer test:types

  node:
    name: Node 26.13.1 workspaces
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout sibling repositories
        env:
          VAULTER_READ_TOKEN: ${{ secrets.VAULTER_READ_TOKEN }}
        run: scripts/ci/checkout-ecosystem.sh vaulter vaulter-collaboration packman

      - name: Install libatomic1
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libatomic1

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Assert Node.js >=26.13.1
        run: |
          node -e 'const parts = process.versions.node.split(".").map(Number); const ok = parts[0] > 26 || (parts[0] === 26 && (parts[1] > 13 || (parts[1] === 13 && parts[2] >= 1))); if (!ok) { console.error(process.versions.node); process.exit(1); }'
          node -e 'const engines = require("./package.json").engines || {}; if (engines.node !== ">=26.13.1") { console.error(engines); process.exit(1); }'

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.4"
          extensions: mbstring, xml, xmlreader, zip, pdo_pgsql, pgsql
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build sibling @vaulter/vue
        run: (cd ../vaulter && npm ci --no-audit --no-fund && npm run build --workspace @vaulter/vue)

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test, typecheck and build workspaces
        # Dependency order: vue type-checks against the realtime native-adapter build output.
        run: |
          set -euo pipefail
          for workspace in @vaulter/sheets-runtime @vaulter/sheets-realtime @vaulter/sheets-vue @vaulter/sheets-tiptap; do
            npm run test --workspace "$workspace"
            npm run typecheck --workspace "$workspace"
            npm run build --workspace "$workspace"
          done

      - name: Workbook contract
        run: bash scripts/ci/workbook-contract.sh

      - name: Exchange
        run: bash scripts/ci/exchange.sh

      - name: Realtime
        run: bash scripts/ci/realtime.sh

      - name: Reference
        run: bash scripts/ci/reference.sh

      - name: Workbook browser
        run: bash scripts/ci/workbook-browser.sh

      - name: Office sheets
        run: bash scripts/ci/office-sheets.sh

  images:
    name: Runtime and realtime images
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build runtime image
        run: docker build --pull -f packages/runtime/Dockerfile -t vaulter-sheets-runtime:ci .

      - name: Build realtime image
        run: docker build --pull -f packages/realtime/Dockerfile -t vaulter-sheets-realtime:ci .

