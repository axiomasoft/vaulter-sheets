name: CI

# Scaffold gate. Matrix: PostgreSQL 18.7 and 19.0, Node.js 26.13.1, PHP 8.4.
# Stop-cranes from engineering-standards §2, enforced before review:
# Zero-Royalty denylist (0 forbidden packages), 64-bit hashtextextended locks,
# no session pg_advisory_lock, no DEFERRABLE INITIALLY DEFERRED, no raw
# DB::transaction(), no set_config(..., false), no parse_url(), no
# ZipArchive::extractTo(), no CURLOPT_RESOLVE, no unindexed FK, no
# Helpers/Utils/Common/Misc/Traits directories, no @phpstan-ignore,
# no @psalm-suppress, no test ->skip(), no Eloquent Model on an #[Api]
# surface, no libclamav linkage, no registry.tiptap.dev.
# The embedded checker carries a negative fixture (--self-test) that must fail
# when a forbidden package or a banned call is introduced.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stop-cranes:
    name: PG ${{ matrix.postgres }} / Node 26.13.1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['18.7', '19.0']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: vaulter
          POSTGRES_DB: vaulter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaulter -d vaulter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: vaulter
      PGPASSWORD: vaulter
      PGDATABASE: vaulter
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"

      - name: Assert Node.js >=26.13.1
        run: |
          node -e 'const parts = process.versions.node.split(".").map(Number); const ok = parts[0] > 26 || (parts[0] === 26 && (parts[1] > 13 || (parts[1] === 13 && parts[2] >= 1))); if (!ok) { console.error(process.versions.node); process.exit(1); }'
          node -e 'const engines = require("./package.json").engines || {}; if (engines.node !== ">=26.13.1") { console.error(engines); process.exit(1); }'

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: "8.4"
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-version --strict --no-interaction

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Assert PostgreSQL ${{ matrix.postgres }}
        run: |
          ver=$(psql -tAc 'SHOW server_version')
          ver=${ver//[[:space:]]/}
          echo "server_version=${ver}"
          expected="${{ matrix.postgres }}"
          case "${ver}" in
            ${expected}*) ;;
            *) echo "expected PostgreSQL ${expected}, got ${ver}" >&2; exit 1 ;;
          esac

      - name: Zero unindexed foreign keys
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          -- Automated PostgreSQL catalog gate: every foreign key MUST be backed by a valid,
          -- ready, non-partial index whose leading columns match pg_constraint.conkey.
          -- Fails the transaction with an explicit list of offending (table, constraint) pairs.
          DO $$
          DECLARE
              missing text;
          BEGIN
              WITH fks AS (
                  SELECT
                      c.conrelid,
                      c.conname,
                      c.conkey
                  FROM pg_catalog.pg_constraint c
                  JOIN pg_catalog.pg_namespace n ON n.oid = c.connamespace
                  WHERE c.contype = 'f'
                    AND n.nspname NOT IN ('pg_catalog', 'information_schema')
              ),
              valid_indexes AS (
                  SELECT
                      i.indrelid,
                      (string_to_array(i.indkey::text, ' '))::smallint[] AS indkey_arr
                  FROM pg_catalog.pg_index i
                  WHERE i.indisvalid
                    AND i.indisready
                    AND i.indpred IS NULL
              )
              SELECT string_agg(fk.conrelid::regclass::text || '.' || fk.conname, ', ' ORDER BY fk.conrelid::regclass::text, fk.conname)
              INTO missing
              FROM fks fk
              LEFT JOIN valid_indexes idx
                ON idx.indrelid = fk.conrelid
               AND idx.indkey_arr[1:cardinality(fk.conkey)] = fk.conkey
              WHERE idx.indrelid IS NULL;

              IF missing IS NOT NULL THEN
                  RAISE EXCEPTION 'Unindexed foreign keys detected: %', missing;
              END IF;
          END $$;
          SQL

      - name: License and source stop-cranes
        run: |
          cat > "$RUNNER_TEMP/stop-cranes.py" <<'PY'
          #!/usr/bin/env python3
          """Scaffold stop-cranes for a Vaulter satellite repository.

          Scans committed manifests and sources for the Zero-Royalty denylist and the
          source bans in engineering-standards §2 that a text scan can see. Exit 0
          means zero hits. ``--self-test`` proves a forbidden tree fails and an
          allowed twin passes.
          """

          from __future__ import annotations

          import argparse
          import json
          import re
          import sys
          import tempfile
          from pathlib import Path

          FORBIDDEN_EXACT = frozenset(
              {
                  "handsontable",
                  "hyperformula",
                  "dunglas/mercure",
                  "minio/minio",
                  "exceljs",
                  "unzipper",
                  "mammoth",
                  "xlsx",
                  "libclamav",
                  "@tiptap-pro",
                  "@univerjs-pro",
                  "@univer-cli",
              }
          )
          FORBIDDEN_PREFIXES = ("@tiptap-pro/", "@univerjs-pro/", "@univer-cli/")
          DEP_KEYS = frozenset(
              {
                  "require",
                  "require-dev",
                  "conflict",
                  "dependencies",
                  "devDependencies",
                  "optionalDependencies",
                  "peerDependencies",
              }
          )
          SKIP_DIRS = frozenset(
              {
                  ".git",
                  "vendor",
                  "node_modules",
                  "build",
                  "dist",
                  "coverage",
                  ".github",
                  ".phpunit.cache",
              }
          )
          SOURCE_EXT = frozenset({".php", ".sql", ".js", ".mjs", ".cjs", ".ts", ".tsx", ".vue"})
          LOCK_NAMES = frozenset({"composer.lock", "package-lock.json", "pnpm-lock.yaml", "yarn.lock"})
          LOCK_NEEDLES = (
              "@tiptap-pro/",
              "@univerjs-pro/",
              "@univer-cli/",
              "registry.tiptap.dev",
              "handsontable",
              "hyperformula",
              "dunglas/mercure",
              "minio/minio",
              "exceljs",
              "unzipper",
              "mammoth",
              "libclamav",
              "xlsx@0.18.5",
          )
          BANNED = (
              ("hashtext(", re.compile(r"\bhashtext\s*\(")),
              ("session advisory lock", re.compile(r"\bpg_(?:try_)?advisory_lock\s*\(")),
              ("DEFERRABLE INITIALLY DEFERRED", re.compile(r"DEFERRABLE\s+INITIALLY\s+DEFERRED", re.I)),
              ("DB::transaction()", re.compile(r"\bDB::transaction\s*\(")),
              ("set_config(..., false)", re.compile(r"\bset_config\s*\([^;]*\bfalse\b", re.I)),
              ("parse_url()", re.compile(r"\bparse_url\s*\(")),
              ("ZipArchive::extractTo()", re.compile(r"\bZipArchive::extractTo\s*\(")),
              ("CURLOPT_RESOLVE", re.compile(r"\bCURLOPT_RESOLVE\b")),
              ("@phpstan-ignore", re.compile(r"@phpstan-ignore\b")),
              ("@psalm-suppress", re.compile(r"@psalm-suppress\b")),
              ("REPACK (CONCURRENTLY)", re.compile(r"\bREPACK\s*\(\s*CONCURRENTLY\b", re.I)),
              ("libclamav", re.compile(r"\blibclamav\b")),
              ("registry.tiptap.dev", re.compile(r"registry\.tiptap\.dev")),
          )
          SKIP_CALL = re.compile(r"->skip\s*\(")
          ELOQUENT = "Illuminate\\Database\\Eloquent\\Model"
          FORBIDDEN_DIR_NAMES = frozenset({"Helpers", "Utils", "Common", "Misc", "Traits"})
          COPYLEFT = re.compile(r"\b(?:AGPL|GPL|SSPL)(?:-|\b)", re.I)
          MANIFEST_NAMES = frozenset({"composer.json", "package.json"})


          def forbidden_name(name: str) -> str | None:
              if name in FORBIDDEN_EXACT:
                  return name
              for prefix in FORBIDDEN_PREFIXES:
                  if name.startswith(prefix):
                      return name
              return None


          def add(hits: list[str], path: Path, detail: str) -> None:
              hits.append(f"{path}: {detail}")


          def walk_deps(node: object, hits: list[str], path: Path) -> None:
              if isinstance(node, dict):
                  name = node.get("name")
                  if isinstance(name, str):
                      bad = forbidden_name(name)
                      if bad is not None:
                          add(hits, path, f"forbidden package {bad}")
                  license_value = node.get("license")
                  if isinstance(license_value, str) and COPYLEFT.search(license_value):
                      add(hits, path, f"copyleft license {license_value}")
                  for key, value in node.items():
                      if key in DEP_KEYS and isinstance(value, dict):
                          for dep in value:
                              if isinstance(dep, str):
                                  bad = forbidden_name(dep)
                                  if bad is not None:
                                      add(hits, path, f"forbidden dependency {bad}")
                      else:
                          walk_deps(value, hits, path)
              elif isinstance(node, list):
                  for item in node:
                      walk_deps(item, hits, path)


          def is_source(path: Path) -> bool:
              return path.name == "Dockerfile" or path.name.startswith("Dockerfile.") or path.suffix in SOURCE_EXT


          def is_test(path: Path) -> bool:
              if path.name.endswith("Test.php") or ".test." in path.name:
                  return True
              return "tests" in path.parts


          def skipped(path: Path) -> bool:
              return any(part in SKIP_DIRS for part in path.parts)


          def scan(root: Path) -> list[str]:
              hits: list[str] = []
              if not root.is_dir():
                  return [f"{root}: not a directory"]

              composer = root / "composer.json"
              if not composer.is_file():
                  hits.append(f"{composer}: missing")
              else:
                  try:
                      data = json.loads(composer.read_text(encoding="utf-8"))
                  except json.JSONDecodeError as exc:
                      hits.append(f"{composer}: invalid JSON ({exc})")
                      data = None
                  if isinstance(data, dict):
                      php = (data.get("require") or {}).get("php")
                      if php != ">=8.4 <8.6":
                          hits.append(f"{composer}: require.php must be >=8.4 <8.6, got {php!r}")

              package = root / "package.json"
              if not package.is_file():
                  hits.append(f"{package}: missing")
              else:
                  try:
                      data = json.loads(package.read_text(encoding="utf-8"))
                  except json.JSONDecodeError as exc:
                      hits.append(f"{package}: invalid JSON ({exc})")
                      data = None
                  if isinstance(data, dict):
                      node = (data.get("engines") or {}).get("node")
                      if node != ">=26.13.1":
                          hits.append(f"{package}: engines.node must be >=26.13.1, got {node!r}")

              for path in root.rglob("*"):
                  if skipped(path):
                      continue
                  if path.is_dir():
                      if path.name in FORBIDDEN_DIR_NAMES:
                          add(hits, path, "forbidden directory name")
                      continue
                  if path.name in MANIFEST_NAMES or path.name in LOCK_NAMES and path.suffix == ".json":
                      try:
                          walk_deps(json.loads(path.read_text(encoding="utf-8")), hits, path)
                      except json.JSONDecodeError as exc:
                          add(hits, path, f"invalid JSON ({exc})")
                  if path.name in LOCK_NAMES:
                      text = path.read_text(encoding="utf-8", errors="replace")
                      for needle in LOCK_NEEDLES:
                          if needle in text:
                              add(hits, path, f"lockfile contains {needle}")
                  if not is_source(path):
                      continue
                  text = path.read_text(encoding="utf-8", errors="replace")
                  for label, pattern in BANNED:
                      if pattern.search(text):
                          add(hits, path, label)
                  if is_test(path) and SKIP_CALL.search(text):
                      add(hits, path, "->skip()")
                  if "#[Api]" in text and ELOQUENT in text:
                      add(hits, path, "Eloquent Model on an #[Api] surface")
              return hits


          def require_fail(label: str, root: Path) -> None:
              hits = scan(root)
              if not hits:
                  raise SystemExit(f"self-test {label}: expected hits, found none")


          def require_ok(label: str, root: Path) -> None:
              hits = scan(root)
              if hits:
                  raise SystemExit("self-test " + label + ": expected clean, got " + "; ".join(hits))


          def write_base(root: Path, node: str = ">=26.13.1", php: str = ">=8.4 <8.6") -> None:
              root.mkdir()
              (root / "composer.json").write_text(
                  json.dumps({"require": {"php": php}}),
                  encoding="utf-8",
              )
              (root / "package.json").write_text(
                  json.dumps({"engines": {"node": node}}),
                  encoding="utf-8",
              )


          def self_test() -> int:
              with tempfile.TemporaryDirectory() as tmp:
                  base = Path(tmp)

                  clean = base / "clean"
                  write_base(clean)
                  (clean / "ok.php").write_text(
                      "<?php pg_advisory_xact_lock(hashtextextended($k, 0));\n",
                      encoding="utf-8",
                  )
                  (clean / "ok.sql").write_text("DEFERRABLE INITIALLY IMMEDIATE\n", encoding="utf-8")
                  require_ok("allowed calls", clean)

                  bad_pkg = base / "pkg"
                  write_base(bad_pkg)
                  (bad_pkg / "composer.json").write_text(
                      json.dumps({"require": {"php": ">=8.4 <8.6", "handsontable": "^1.0"}}),
                      encoding="utf-8",
                  )
                  require_fail("handsontable", bad_pkg)

                  bad_scope = base / "scope"
                  write_base(bad_scope)
                  (bad_scope / "package.json").write_text(
                      json.dumps(
                          {
                              "engines": {"node": ">=26.13.1"},
                              "dependencies": {"@tiptap-pro/extension-comments": "1.0.0"},
                          }
                      ),
                      encoding="utf-8",
                  )
                  require_fail("@tiptap-pro", bad_scope)

                  bad_hash = base / "hash"
                  write_base(bad_hash)
                  (bad_hash / "lock.php").write_text("<?php hashtext($k);\n", encoding="utf-8")
                  require_fail("hashtext", bad_hash)

                  bad_lock = base / "lock"
                  write_base(bad_lock)
                  (bad_lock / "session.php").write_text("<?php pg_advisory_lock($k);\n", encoding="utf-8")
                  require_fail("pg_advisory_lock", bad_lock)

                  bad_sql = base / "sql"
                  write_base(bad_sql)
                  (bad_sql / "hot.sql").write_text(
                      "ALTER TABLE t ADD CONSTRAINT c FOREIGN KEY (id) REFERENCES p(id) DEFERRABLE INITIALLY DEFERRED;\n",
                      encoding="utf-8",
                  )
                  require_fail("INITIALLY DEFERRED", bad_sql)

                  bad_dir = base / "dirs"
                  write_base(bad_dir)
                  (bad_dir / "Helpers").mkdir()
                  require_fail("Helpers", bad_dir)

                  bad_node = base / "node"
                  write_base(bad_node, node=">=26")
                  require_fail("engines.node", bad_node)

              print("stop-crane self-test: pass")
              return 0


          def main(argv: list[str]) -> int:
              parser = argparse.ArgumentParser()
              parser.add_argument("--root", default=".")
              parser.add_argument("--self-test", action="store_true")
              args = parser.parse_args(argv)
              if args.self_test:
                  return self_test()
              hits = scan(Path(args.root).resolve())
              if hits:
                  print(f"stop-cranes: {len(hits)} hit(s)")
                  for hit in hits:
                      print(hit)
                  return 1
              print("stop-cranes: 0 hits")
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          PY
          python3 "$RUNNER_TEMP/stop-cranes.py" --root "$GITHUB_WORKSPACE"
          python3 "$RUNNER_TEMP/stop-cranes.py" --self-test

  image-template:
    name: Node image template
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Node 26.13.1 template
        run: docker build --pull --build-arg SERVICE_PORT=3100 -t vaulter-node-template:ci .

