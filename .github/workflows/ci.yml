name: CI

# DAG (GitHub draws this from `needs`):
#   changes → quality → { php, node, images } → CI gate
#
# quality is the fast fail: stop-cranes, composer validate, Pint, PHPStan, Rector,
# 100 % type coverage, the Node engines assertion, actionlint and zizmor. The
# heavier lanes only start after it succeeds. Path filters skip unaffected lanes
# on feature branches; a push to main, workflow_dispatch, or a change under
# .github/ always runs every lane. `CI gate` is the single check a branch rule
# should require (skipped lanes are allowed).
#
# Siblings (../vaulter, ../vaulter-collaboration, ../packman) come from
# scripts/ci/checkout-ecosystem.sh. VAULTER_READ_TOKEN is optional now that those
# repositories are public; when set, it is sent as an HTTP header (never in a URL).

on:
  push:
    branches: [main, 'refactor/**', 'feat/**', 'fix/**', 'hotfix/**', 'chore/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VAULTER_READ_TOKEN: ${{ secrets.VAULTER_READ_TOKEN }}
  COMPOSER_NO_INTERACTION: "1"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      php: ${{ steps.plan.outputs.php }}
      node: ${{ steps.plan.outputs.node }}
      docker: ${{ steps.plan.outputs.docker }}
      e2e: ${{ steps.plan.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Filter paths
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            php:
              - "**/*.php"
              - "composer.json"
              - "phpstan*"
              - "pint.json"
              - "rector.php"
              - "**/phpunit.xml*"
            node:
              - "package.json"
              - "package-lock.json"
              - "packages/**/package.json"
              - "packages/**/*.{js,mjs,cjs,ts,tsx,vue,json}"
              - "scripts/**/*.{js,mjs,cjs,sh}"
            docker:
              - "**/Dockerfile*"
            e2e:
              - "scripts/ci/*.sh"
              - "tests/e2e/**"
            workflows:
              - ".github/**"
              - "scripts/ci/**"

      - name: Plan lanes
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          FILTER_PHP: ${{ steps.filter.outputs.php }}
          FILTER_NODE: ${{ steps.filter.outputs.node }}
          FILTER_DOCKER: ${{ steps.filter.outputs.docker }}
          FILTER_E2E: ${{ steps.filter.outputs.e2e }}
          FILTER_WORKFLOWS: ${{ steps.filter.outputs.workflows }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" || "$REF" == "refs/heads/main" || "$FILTER_WORKFLOWS" == "true" || -z "$FILTER_PHP" ]]; then
            full=true; php=true; node=true; docker=true; e2e=true
          else
            full=false
            php=${FILTER_PHP:-false}
            node=${FILTER_NODE:-false}
            docker=${FILTER_DOCKER:-false}
            e2e=${FILTER_E2E:-false}
          fi
          {
            echo "full=$full"
            echo "php=$php"
            echo "node=$node"
            echo "docker=$docker"
            echo "e2e=$e2e"
          } >> "$GITHUB_OUTPUT"
          echo "lanes full=$full php=$php node=$node docker=$docker e2e=$e2e"

  quality:
    name: Quality (stop-cranes, Pint, PHPStan, Rector, type coverage, workflow lint)
    needs: changes
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.php == 'true' || needs.changes.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: $/.github/actions/setup-node
        with:
          node-version: "26.13.1"
          install: "false"

      - name: Assert Node.js >=26.13.1
        run: |
          node -e 'const parts = process.versions.node.split(".").map(Number); const ok = parts[0] > 26 || (parts[0] === 26 && (parts[1] > 13 || (parts[1] === 13 && parts[2] >= 1))); if (!ok) { console.error(process.versions.node); process.exit(1); }'
          node -e 'const engines = require("./package.json").engines || {}; if (engines.node !== ">=26.13.1") { console.error(engines); process.exit(1); }'

      - name: Checkout sibling repositories
        run: scripts/ci/checkout-ecosystem.sh vaulter vaulter-collaboration packman

      - name: Setup PHP and Composer
        uses: $/.github/actions/setup-php
        with:
          php-version: "8.4"
          extensions: mbstring, xml, xmlreader, zip, pdo_pgsql, pgsql
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-version --strict --no-interaction

      - name: License and source stop-cranes
        run: |
          python3 scripts/ci/engineering-rails.py --root "$GITHUB_WORKSPACE"
          python3 scripts/ci/engineering-rails.py --self-test

      - name: Pint
        run: composer lint:check

      - name: PHPStan
        run: composer analyse

      - name: Rector (dry run)
        run: composer refactor:check

      - name: Type coverage
        run: composer test:types

      - name: Lint workflows
        uses: $/.github/actions/lint-workflows

      - name: Quality summary
        if: always()
        run: |
          {
            echo "## Quality"
            echo
            echo "Stop-cranes, composer validate, Pint, PHPStan, Rector, 100 % type coverage, actionlint and zizmor ran on PHP 8.4 / Node 26.13.1."
          } >> "$GITHUB_STEP_SUMMARY"

  php:
    name: PHP ${{ matrix.php }} / PG ${{ matrix.postgres }}
    needs: [changes, quality]
    if: always() && needs.quality.result == 'success' && (needs.changes.outputs.full == 'true' || needs.changes.outputs.php == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        postgres: ['18.7', '19.0']
        include:
          - postgres: '18.7'
            image: postgres:18.7@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
          - postgres: '19.0'
            image: postgres:19.0@sha256:aaa10f7ba7328b4a221a6c3184d83eef885bd16bf1f6de864757863156b0a4d1
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: vaulter
          POSTGRES_DB: vaulter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaulter -d vaulter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: vaulter_test
      DB_USERNAME: vaulter
      DB_PASSWORD: vaulter
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: vaulter
      PGPASSWORD: vaulter
      PGDATABASE: vaulter_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout sibling repositories
        run: scripts/ci/checkout-ecosystem.sh vaulter vaulter-collaboration packman

      - name: Setup PHP and Composer
        uses: $/.github/actions/setup-php
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, xmlreader, zip, pdo_pgsql, pgsql
          coverage: ${{ matrix.php == '8.4' && matrix.postgres == '18.7' && 'pcov' || 'none' }}

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Assert PostgreSQL ${{ matrix.postgres }}
        env:
          EXPECTED: ${{ matrix.postgres }}
        run: |
          ver=$(psql -tAc 'SHOW server_version')
          ver=${ver//[[:space:]]/}
          echo "server_version=${ver}"
          case "${ver}" in
            "${EXPECTED}"*) ;;
            *) echo "expected PostgreSQL ${EXPECTED}, got ${ver}" >&2; exit 1 ;;
          esac

      - name: Install libatomic1
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libatomic1

      - name: Setup Node
        uses: $/.github/actions/setup-node
        with:
          node-version: "26.13.1"

      - name: Migrate
        run: php tests/e2e/owner.php

      - name: Zero unindexed foreign keys
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci/unindexed-fks.sql

      - name: Test
        env:
          WITH_COVERAGE: ${{ matrix.php == '8.4' && matrix.postgres == '18.7' && '1' || '0' }}
        run: |
          if [[ "$WITH_COVERAGE" == 1 ]]; then
            mkdir -p build/coverage
            composer test -- --coverage --coverage-clover build/coverage/clover.xml
          else
            composer test
          fi

      - name: Upload coverage
        if: matrix.php == '8.4' && matrix.postgres == '18.7'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-php-pgsql
          path: build/coverage/clover.xml
          if-no-files-found: warn
          retention-days: 14

  node:
    name: Node 26.13.1 workspaces
    needs: [changes, quality]
    if: always() && needs.quality.result == 'success' && (needs.changes.outputs.full == 'true' || needs.changes.outputs.node == 'true' || needs.changes.outputs.php == 'true' || needs.changes.outputs.e2e == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout sibling repositories
        run: scripts/ci/checkout-ecosystem.sh vaulter vaulter-collaboration packman

      - name: Install libatomic1
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libatomic1

      - name: Setup Node
        uses: $/.github/actions/setup-node
        with:
          node-version: "26.13.1"
          install: "false"

      - name: Assert Node.js >=26.13.1
        run: |
          node -e 'const parts = process.versions.node.split(".").map(Number); const ok = parts[0] > 26 || (parts[0] === 26 && (parts[1] > 13 || (parts[1] === 13 && parts[2] >= 1))); if (!ok) { console.error(process.versions.node); process.exit(1); }'
          node -e 'const engines = require("./package.json").engines || {}; if (engines.node !== ">=26.13.1") { console.error(engines); process.exit(1); }'

      - name: Setup PHP and Composer
        uses: $/.github/actions/setup-php
        with:
          php-version: "8.4"
          extensions: mbstring, xml, xmlreader, zip, pdo_pgsql, pgsql
          coverage: none

      - name: Build sibling @vaulter/vue
        run: (cd ../vaulter && npm ci --no-audit --no-fund && npm run build --workspace @vaulter/vue)

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test, typecheck and build workspaces
        # Dependency order: vue type-checks against the realtime native-adapter build output.
        run: |
          set -euo pipefail
          for workspace in @vaulter/sheets-runtime @vaulter/sheets-realtime @vaulter/sheets-vue @vaulter/sheets-tiptap; do
            npm run test --workspace "$workspace"
            npm run typecheck --workspace "$workspace"
            npm run build --workspace "$workspace"
          done

      - name: Workbook contract
        run: bash scripts/ci/workbook-contract.sh

      - name: Exchange
        run: bash scripts/ci/exchange.sh

      - name: Realtime
        run: bash scripts/ci/realtime.sh

      - name: Reference
        run: bash scripts/ci/reference.sh

      - name: Workbook browser
        run: bash scripts/ci/workbook-browser.sh

      - name: Office sheets
        run: bash scripts/ci/office-sheets.sh

  images:
    name: Runtime and realtime images
    needs: [changes, quality]
    if: always() && (needs.quality.result == 'success' || needs.quality.result == 'skipped') && (needs.changes.outputs.full == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.node == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build runtime image
        run: docker build --pull -f packages/runtime/Dockerfile -t vaulter-sheets-runtime:ci .

      - name: Build realtime image
        run: docker build --pull -f packages/realtime/Dockerfile -t vaulter-sheets-realtime:ci .

  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, quality, php, node, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          lines = [f"- `{name}`: {job['result']}" for name, job in sorted(needs.items())]
          failed = {name: job["result"] for name, job in needs.items() if job["result"] not in ("success", "skipped")}
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("## CI gate\n\n")
                  fh.write("\n".join(lines) + "\n")
                  if failed:
                      fh.write("\nA skipped lane is allowed when the path filter dropped it; failed or cancelled jobs are not.\n")
          for name, result in sorted(failed.items()):
              print(f"::error::{name}: {result}")
          if failed:
              sys.exit(1)
          print("all required jobs succeeded or were skipped")
          PY
